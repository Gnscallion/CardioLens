{% extends "base.html" %}
{% block title %}{{ code }} · {{ app_name }}{% endblock %}

{% block content %}
<div class="card">
  <div class="empty">
    <div class="big">{{ '🔍' if code == 404 else '⚠' }}</div>
    <h2 style="font-size:3rem;margin:0;color:var(--brand)">{{ code }}</h2>
    <p style="font-size:1.05rem">{{ message }}</p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-primary" href="{{ url_for('page_index') }}">返回首页</a>
      <a class="btn btn-ghost" href="{{ url_for('page_analyze') }}">去做分析</a>
    </div>
  </div>
</div>
{% endblock %}
